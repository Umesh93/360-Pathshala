khalti.secret-key=${KHALTI_SECRET_KEY:}
khalti.base-url=${KHALTI_BASE_URL:https://dev.khalti.com/api/v2}
khalti.website-url=${KHALTI_WEBSITE_URL:http://localhost:5173}
khalti.return-url=${KHALTI_RETURN_URL:http://localhost:8080/api/payments/khalti/callback}
khalti.connect-timeout-ms=${KHALTI_CONNECT_TIMEOUT_MS:3000}
khalti.read-timeout-ms=${KHALTI_READ_TIMEOUT_MS:8000}
app.subscription.scheduler-cron=${SUBSCRIPTION_SCHEDULER_CRON:0 0 * * * *}
