spring.application.name=360-pathshala
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.servlet.context-path=/api

#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pathshala_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pathshala_restore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-production-value-360-pathshala}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

