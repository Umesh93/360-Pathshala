spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.email.from=${EMAIL_FROM:umeshkhatri96@gmail.com}
app.email.enabled=${EMAIL_ENABLED:true}
app.login-url=${APP_LOGIN_URL:http://localhost:5173/login}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging.level.org.springframework.security=INFO
logging.level.com.pathshala=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

app.assignment.storage-dir=${ASSIGNMENT_STORAGE_DIR:data/assignments}
app.assignment.max-file-size-bytes=${ASSIGNMENT_MAX_FILE_SIZE_BYTES:10485760}
app.school.logo-storage-dir=${SCHOOL_LOGO_STORAGE_DIR:data/school-assets}
app.school.logo-max-file-size-bytes=${SCHOOL_LOGO_MAX_FILE_SIZE_BYTES:2097152}
app.assignment.reminder-cron=${ASSIGNMENT_REMINDER_CRON:0 0 8 * * *}
app.assignment.publish-cron=${ASSIGNMENT_PUBLISH_CRON:0 * * * * *}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

